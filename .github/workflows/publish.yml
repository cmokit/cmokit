# Stages every package whose version is not yet on npm, when a GitHub release is published.
# Authenticates by npm trusted publishing (OIDC): no npm token is stored anywhere. The trusted
# publisher may only stage, so nothing goes live until a maintainer approves each staged version on
# npmjs.com (Staged Packages) or with `npm stage approve <stage-id>`, under two-factor authentication.
# A staged version is not yet on npm, so running this again stages it again; reject the duplicate.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      # Packages publish what this commit builds (ADR-0011).
      - run: npm run build
      - name: Stage new versions
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published"
            else
              (cd "$dir" && npm stage publish)
            fi
          done
