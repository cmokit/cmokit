# Runs the brand-sprint evals (npm run eval:brand-sprint) on a pull request only when a maintainer
# adds the run-evals label to it, so they never run on every opened or updated pull request. They
# call Claude and cost a few dollars a run. They sign in to Anthropic with workload identity
# federation: the job exchanges GitHub's OIDC token for a short-lived Anthropic token, under the
# federation rule the repository variables ANTHROPIC_FEDERATION_RULE_ID and ANTHROPIC_ORGANIZATION_ID
# name, so no API key is stored here. The run takes the label off when it ends, so adding it again
# runs the evals again. Results are in the run's summary, and the transcripts are kept as an artifact.
name: brand-sprint-evals

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  evals:
    # A pull request from a fork cannot get an OIDC token, so it cannot run the evals.
    if: github.event.label.name == 'run-evals' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the evals
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/github-oidc-token
        run: |
          set -o pipefail
          # GitHub's token lasts about five minutes and Anthropic takes each one once, so fetch a
          # fresh one now and every four minutes; the SDK rereads the file when it refreshes.
          oidc() {
            curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.new" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.new" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          oidc
          (while sleep 240; do oidc || true; done) &
          npm run -s eval:brand-sprint 2>&1 | tee evals.txt
      - name: Summary
        if: always()
        run: |
          { echo '## Brand-sprint evals'; echo '```'; cat evals.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-sprint-transcripts
          path: .evals/brand-sprint/
          if-no-files-found: ignore
      - name: Take the label off
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label run-evals || true
