# On every pull request and every push to main: type-checks, checks the decision records and the
# package boundaries, runs the tests, builds every package, and builds the starter site against the
# built packages (ADR-0001, ADR-0002, ADR-0007, ADR-0011).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:starter
